; PHP limits for SiteGround (PHP-FPM reads this file; changes apply within ~5 minutes).
; Allows media-library uploads up to 100 MB, and quote-form artwork (5 files × 50 MB per request).
upload_max_filesize = 100M
post_max_size = 260M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
